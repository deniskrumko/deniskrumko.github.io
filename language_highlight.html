<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Подсветка языка</title>
  <style>
    :root {
      color-scheme: light;
      --page: #f6f7fb;
      --surface: #ffffff;
      --text: #20242c;
      --muted: #737985;
      --border: #e2e5eb;
      --focus: #8b94a7;
      --russian: #dceeff;
      --english: #ffe0e0;
      --kazakh: #dcf5e5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background: var(--page);
      color: var(--text);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    main {
      width: min(720px, 100%);
    }

    .card {
      padding: clamp(22px, 5vw, 38px);
      border: 1px solid rgba(226, 229, 235, 0.85);
      border-radius: 22px;
      background: var(--surface);
      box-shadow: 0 18px 50px rgba(38, 44, 57, 0.08);
    }

    h1 {
      margin: 0;
      font-size: clamp(25px, 4vw, 34px);
      line-height: 1.15;
      letter-spacing: -0.025em;
    }

    .description {
      margin: 10px 0 22px;
      color: var(--muted);
      font-size: 15px;
      line-height: 1.55;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 18px;
      margin-bottom: 12px;
      color: #555c68;
      font-size: 13px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .legend-color {
      width: 13px;
      height: 13px;
      border-radius: 4px;
    }

    .legend-color.russian {
      background: var(--russian);
    }

    .legend-color.english {
      background: var(--english);
    }

    .legend-color.kazakh {
      background: var(--kazakh);
    }

    #editor {
      min-height: 230px;
      max-height: 58vh;
      overflow-y: auto;
      padding: 17px 18px;
      border: 1px solid var(--border);
      border-radius: 14px;
      outline: none;
      background: #fcfcfd;
      font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace;
      font-size: 16px;
      line-height: 1.75;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      caret-color: var(--text);
      transition: border-color 160ms ease, box-shadow 160ms ease,
        background-color 160ms ease;
    }

    #editor:hover {
      border-color: #cfd3dc;
    }

    #editor:focus {
      border-color: var(--focus);
      background: var(--surface);
      box-shadow: 0 0 0 4px rgba(139, 148, 167, 0.13);
    }

    #editor:empty::before {
      content: attr(data-placeholder);
      color: #a3a8b2;
      pointer-events: none;
    }

    .lang-ru,
    .lang-en,
    .lang-kz {
      padding: 0.08em 0.02em;
      border-radius: 3px;
      box-decoration-break: clone;
      -webkit-box-decoration-break: clone;
    }

    .lang-ru {
      background: var(--russian);
    }

    .lang-en {
      background: var(--english);
    }

    .lang-kz {
      background: var(--kazakh);
    }

    @media (max-width: 520px) {
      body {
        align-items: start;
        padding: 14px;
      }

      .card {
        border-radius: 18px;
      }

      #editor {
        min-height: 260px;
        font-size: 15px;
      }
    }
  </style>
</head>
<body>
  <main>
    <section class="card" aria-labelledby="page-title">
      <h1 id="page-title">Подсветка языка</h1>
      <p class="description">
        Введите или вставьте текст — буквы подсветятся автоматически.
      </p>

      <div class="legend" aria-label="Обозначения цветов">
        <span class="legend-item">
          <span class="legend-color russian" aria-hidden="true"></span>
          Кириллица
        </span>
        <span class="legend-item">
          <span class="legend-color english" aria-hidden="true"></span>
          Латиница
        </span>
        <span class="legend-item">
          <span class="legend-color kazakh" aria-hidden="true"></span>
          Казахские буквы
        </span>
      </div>

      <div
        id="editor"
        contenteditable="plaintext-only"
        role="textbox"
        aria-label="Текст для подсветки языка"
        aria-multiline="true"
        data-placeholder="Например: Привет, world!"
        spellcheck="false"
      ></div>
    </section>
  </main>

  <script>
    const editor = document.querySelector("#editor");
    const CARET_MARKER = "\uE000";
    let isComposing = false;

    function getTextAndCaret() {
      const selection = window.getSelection();
      let marker = null;

      if (selection.rangeCount && editor.contains(selection.focusNode)) {
        const range = selection.getRangeAt(0).cloneRange();
        range.collapse(false);
        marker = document.createElement("span");
        marker.textContent = CARET_MARKER;
        range.insertNode(marker);
      }

      let text = editor.innerText.replace(/\r\n?/g, "\n");
      let caret = text.indexOf(CARET_MARKER);

      if (marker) {
        marker.remove();
      }

      if (caret === -1) {
        caret = text.length;
      } else {
        text = text.slice(0, caret) + text.slice(caret + CARET_MARKER.length);
      }

      // Browsers keep a lone <br> in an emptied contenteditable element.
      if (!editor.textContent && text === "\n") {
        text = "";
        caret = 0;
      }

      return { text, caret };
    }

    function appendText(fragment, text, className = "") {
      const lines = text.split("\n");

      lines.forEach((line, index) => {
        if (line) {
          const node = className ? document.createElement("span") : document.createTextNode(line);

          if (className) {
            node.className = className;
            node.textContent = line;
          }

          fragment.append(node);
        }

        if (index < lines.length - 1) {
          fragment.append(document.createElement("br"));
        }
      });
    }

    function renderHighlightedText(text) {
      const fragment = document.createDocumentFragment();
      const languagePattern = /([ӘәҒғҚқҢңӨөҰұҮүҺһІі]+)|([А-Яа-яЁё]+)|([A-Za-z]+)/g;
      let lastIndex = 0;

      for (const match of text.matchAll(languagePattern)) {
        if (match.index > lastIndex) {
          appendText(fragment, text.slice(lastIndex, match.index));
        }

        const className = match[1] ? "lang-kz" : match[2] ? "lang-ru" : "lang-en";
        appendText(fragment, match[0], className);
        lastIndex = match.index + match[0].length;
      }

      if (lastIndex < text.length) {
        appendText(fragment, text.slice(lastIndex));
      }

      editor.replaceChildren(fragment);
    }

    function restoreCaret(targetOffset) {
      const selection = window.getSelection();
      const range = document.createRange();
      let offset = 0;

      for (const node of editor.childNodes) {
        if (node.nodeName === "BR") {
          if (targetOffset === offset) {
            range.setStartBefore(node);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
            return;
          }

          offset += 1;

          if (targetOffset === offset) {
            range.setStartAfter(node);
            range.collapse(true);
            selection.removeAllRanges();
            selection.addRange(range);
            return;
          }

          continue;
        }

        const textNode = node.nodeType === Node.TEXT_NODE ? node : node.firstChild;
        const length = textNode?.textContent.length ?? 0;

        if (targetOffset <= offset + length && textNode) {
          range.setStart(textNode, Math.max(0, targetOffset - offset));
          range.collapse(true);
          selection.removeAllRanges();
          selection.addRange(range);
          return;
        }

        offset += length;
      }

      range.selectNodeContents(editor);
      range.collapse(false);
      selection.removeAllRanges();
      selection.addRange(range);
    }

    function highlight() {
      const { text, caret } = getTextAndCaret();
      renderHighlightedText(text);
      restoreCaret(caret);
    }

    editor.addEventListener("compositionstart", () => {
      isComposing = true;
    });

    editor.addEventListener("compositionend", () => {
      isComposing = false;
      highlight();
    });

    editor.addEventListener("input", () => {
      if (!isComposing) {
        highlight();
      }
    });

    editor.addEventListener("paste", (event) => {
      event.preventDefault();
      const text = event.clipboardData.getData("text/plain");
      const selection = window.getSelection();

      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      range.deleteContents();
      const textNode = document.createTextNode(text);
      range.insertNode(textNode);
      range.setStartAfter(textNode);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      highlight();
    });
  </script>
</body>
</html>
